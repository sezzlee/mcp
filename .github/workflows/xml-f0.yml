name: XML F0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xml-f0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: xml f0 (${{ matrix.target.id }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        target:
          - { id: linux-x64, os: ubuntu-24.04 }
          - { id: linux-arm64, os: ubuntu-24.04-arm }
          - { id: darwin-x64, os: macos-15-intel }
          - { id: darwin-arm64, os: macos-15 }
          - { id: win32-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check-types lint --filter=@sezzlee/xml-lab
      - run: pnpm turbo run test --filter=@sezzlee/xml-lab --force
        env:
          SEZZLEE_XML_BENCH: "1"
      - run: node packages/lab/xml-lab/collect-evidence.mjs
        if: always()
        continue-on-error: true
        env:
          SEZZLEE_XML_BENCH: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xml-f0-${{ matrix.target.id }}-node${{ matrix.node }}
          path: packages/lab/xml-lab/out/f0/*.json
          if-no-files-found: error
