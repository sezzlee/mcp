name: Excel benchmark

# Opt-in only: a maintainer adds the `bench` label to a pull request, or
# dispatches it. pull_request (never pull_request_target) keeps a fork's run
# on a read-only token with no secrets, and the job reads none.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      base:
        description: Commit or ref to compare the dispatched ref against
        required: true
        default: main
      runs:
        description: Alternating trials per side
        required: true
        default: "5"

permissions:
  contents: read

concurrency:
  group: excel-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
      (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_INPUT: ${{ github.event.pull_request.base.sha || inputs.base }}
      RUNS: ${{ inputs.runs || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@sezzlee/excel-mcp
      - name: Build the base
        run: |
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a number" >&2; exit 1 ;; esac
          base=$(git rev-parse --verify --end-of-options "$BASE_INPUT^{commit}")
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          cp packages/lab/excel-lab/src/aggregate-bench.ts "$RUNNER_TEMP/base/packages/lab/excel-lab/src/"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@sezzlee/excel-mcp
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Alternate trials
        run: |
          legacy=
          if grep -q 'coerceText:' "$RUNNER_TEMP/base/packages/servers/excel-mcp/src/tools/definitions.ts"; then
            legacy=--legacy-coerce-text
          fi
          for _ in $(seq "$RUNS"); do
            node packages/lab/excel-lab/src/aggregate-bench.ts \
              --out "$RUNNER_TEMP/bench/head" --revision "$HEAD_SHA" --runs 1
            (cd "$RUNNER_TEMP/base" && node packages/lab/excel-lab/src/aggregate-bench.ts \
              --out "$RUNNER_TEMP/bench/base" --revision "$BASE_SHA" --runs 1 $legacy)
          done
      - name: Typed corpus
        run: |
          node packages/lab/excel-lab/src/typed-corpus-cli.ts \
            --out "$RUNNER_TEMP/typed" --revision "$HEAD_SHA" | tee "$RUNNER_TEMP/bench/typed.jsonl"
      - name: Summary
        run: node .github/scripts/bench-summary.mjs "$RUNNER_TEMP/bench" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: excel-bench
          path: |
            ${{ runner.temp }}/bench/*/aggregate-results.jsonl
            ${{ runner.temp }}/bench/typed.jsonl
          if-no-files-found: error
