name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full CI and pack, but do not publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - name: Publish tarballs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # npm reads a bare "dir/file.tgz" as a GitHub owner/repo; the ./ keeps it a file.
          for tgz in ./tarballs/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "skip $spec: already published"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tgz" --access public --dry-run
            else
              npm publish "$tgz" --access public --provenance
            fi
          done

  publish-nuget:
    needs: ci
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Sezzlee.AspNetCore-nupkg
          path: nupkg
      - name: NuGet login
        id: login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          ls ./nupkg/*.nupkg ./nupkg/*.snupkg
          for nupkg in ./nupkg/*.nupkg; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry run: would push $nupkg"
              continue
            fi
            dotnet nuget push "$nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
