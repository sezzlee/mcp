name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full CI and pack, but do not publish
        type: boolean
        default: true
      from_run:
        description: Id of a green Publish run of this same main commit; its packages are published and CI is not run again
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ inputs.from_run == '' }}
    uses: ./.github/workflows/ci.yml

  # Guard: publishing another run's packages is only as safe as the check that the run built
  # this very commit on main and passed the full CI, release matrix included. Anything looser
  # would let a stale or failed build reach the registries without CI ever running on it.
  source:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && inputs.from_run != '')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.pick.outputs.run-id }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          set -euo pipefail
          if [ -z "$FROM_RUN" ]; then
            echo "run-id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$FROM_RUN" in
            *[!0-9]*) echo "::error::from_run must be a numeric run id" ; exit 1 ;;
          esac
          IFS=$'\t' read -r path branch sha status conclusion < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN" \
              --jq '[.path, .head_branch, .head_sha, .status, (.conclusion // "")] | @tsv')
          fail() { echo "::error::run $FROM_RUN $1" ; exit 1 ; }
          [ "$path" = ".github/workflows/publish.yml" ] || fail "is not a Publish run ($path)"
          [ "$branch" = "main" ] || fail "did not build main ($branch)"
          [ "$sha" = "$GITHUB_SHA" ] || fail "built $sha, not $GITHUB_SHA"
          [ "$status/$conclusion" = "completed/success" ] || fail "is $status/$conclusion, not green"
          echo "Publishing the packages run $FROM_RUN built and tested."
          echo "run-id=$FROM_RUN" >> "$GITHUB_OUTPUT"

  publish:
    needs: source
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - name: Publish tarballs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # npm reads a bare "dir/file.tgz" as a GitHub owner/repo; the ./ keeps it a file.
          for tgz in ./tarballs/*.tgz; do
            spec=$(tar -xOzf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "skip $spec: already published"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tgz" --access public --dry-run
            else
              npm publish "$tgz" --access public --provenance
            fi
          done

  publish-nuget:
    needs: source
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Sezzlee.AspNetCore-nupkg
          path: nupkg
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: NuGet login
        id: login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          ls ./nupkg/*.nupkg ./nupkg/*.snupkg
          for nupkg in ./nupkg/*.nupkg; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry run: would push $nupkg"
              continue
            fi
            dotnet nuget push "$nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
