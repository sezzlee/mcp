name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every package and every matrix leg, whatever changed
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a release
# build started by publish.yml never shares a group with a push to main,
# which would cancel it halfway through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scope is the packages changed since the last green CI of main (a pull
  # request's base for a pull request) plus the packages about to be published,
  # each with its dependents. A pull request never runs the native matrix or
  # packs; .github/scripts/plan-ci.mjs falls back to everything when it cannot
  # tell what a change touches.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      filters: ${{ steps.plan.outputs.filters }}
      native: ${{ steps.plan.outputs.native }}
      node_versions: ${{ steps.plan.outputs.node_versions }}
      pack: ${{ steps.plan.outputs.pack }}
      pack_build: ${{ steps.plan.outputs.pack_build }}
      pack_filters: ${{ steps.plan.outputs.pack_filters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/plan-ci.mjs

  native:
    name: secure files (${{ matrix.target.id }}, Node ${{ matrix.node }})
    needs: plan
    if: ${{ needs.plan.outputs.native == 'true' }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only Node 24 uploads a prebuild, so the Node 22 legs are pure
        # compatibility checks. They run when a file package is being released
        # or the run is full; plan decides.
        node: ${{ fromJSON(needs.plan.outputs.node_versions) }}
        # pdf: whether the PDF engine publishes a prebuilt binary for this
        # target. @firecrawl/pdf-inspector ships no darwin-x64 build and its
        # wasm fallback is unpublished, so @sezzlee/pdf-mcp is left out of that
        # leg rather than failing it.
        target:
          - { id: linux-x64, os: ubuntu-24.04, pdf: true }
          - { id: linux-arm64, os: ubuntu-24.04-arm, pdf: true }
          - { id: darwin-x64, os: macos-15-intel, pdf: false }
          - { id: darwin-arm64, os: macos-15, pdf: true }
          - { id: win32-x64, os: windows-2022, pdf: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/prepare-native.mjs
      - run: pnpm turbo run test check-types --filter=@sezzlee/file-core-native --filter=@sezzlee/mcp-core --filter=@sezzlee/file-core --filter=@sezzlee/ooxml-core --filter=@sezzlee/excel-mcp --filter=@sezzlee/xml-mcp --filter=@sezzlee/llm-mcp ${{ matrix.target.pdf && '--filter=@sezzlee/pdf-mcp --filter=@sezzlee/pdf-raster-pdfjs --filter=@sezzlee/ocr-ollama' || '' }}
      - run: pnpm pack --filter=@sezzlee/file-core-native --filter=@sezzlee/mcp-core --filter=@sezzlee/file-core --filter=@sezzlee/ooxml-core --filter=@sezzlee/excel-mcp --filter=@sezzlee/xml-mcp --filter=@sezzlee/llm-mcp ${{ matrix.target.pdf && '--filter=@sezzlee/pdf-mcp --filter=@sezzlee/pdf-raster-pdfjs --filter=@sezzlee/ocr-ollama' || '' }} --pack-destination ./local/native-tarballs
      - run: python3 .github/scripts/check-npm-tarballs.py local/native-tarballs
      - run: node .github/scripts/smoke-file-packages.mjs local/native-tarballs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 24
        with:
          name: native-${{ matrix.target.id }}
          path: packages/cores/file-core-native/prebuilds/
          if-no-files-found: error

  node:
    name: build, lint, types, fixtures
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILTERS: ${{ needs.plan.outputs.filters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: ${{ needs.plan.outputs.filters != '' }}
        run: |
          read -ra filters <<< "$FILTERS"
          pnpm turbo run build check-types lint validate "${filters[@]}"
      - run: pnpm turbo run format:check
      - if: ${{ needs.plan.outputs.filters != '' }}
        run: |
          read -ra filters <<< "$FILTERS"
          pnpm turbo run test "${filters[@]}"

  # The lockfile pins the NestJS SDK's host stack to Nest 11 on Express 5,
  # which the node job covers. Its peer range also admits Nest 10 on Express 4
  # and Nest 12, and it reads Nest and Express internals that differ between
  # them, so each leg swaps the host stack in and runs the SDK's whole suite.
  nest-compat:
    name: NestJS host (${{ matrix.leg.id }})
    needs: plan
    if: ${{ contains(needs.plan.outputs.filters, '@sezzlee/sdk-nestjs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg:
          - id: nest10-express4
            packages: "@nestjs/common@^10 @nestjs/core@^10 @nestjs/platform-express@^10 @nestjs/testing@^10 @nestjs/swagger@^8 express@^4 @types/express@^4"
          - id: nest12-express5
            packages: "@nestjs/common@^12 @nestjs/core@^12 @nestjs/platform-express@^12 @nestjs/testing@^12 @nestjs/swagger@^12"
    env:
      PACKAGES: ${{ matrix.leg.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@sezzlee/sdk-nestjs^...
      - run: |
          read -ra packages <<< "$PACKAGES"
          pnpm --filter @sezzlee/sdk-nestjs add -D --ignore-scripts "${packages[@]}"
      - run: pnpm --filter @sezzlee/sdk-nestjs exec vitest run

  # Packs what a publish can release: the HTTP catalog packages always, the
  # file packages only when the native matrix built their prebuilds. Publish
  # skips any version already on its registry, so a package left out here is
  # one whose version is already published.
  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan, node, native]
    if: ${{ !cancelled() && needs.plan.outputs.pack == 'true' && needs.node.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.native.result) }}
    env:
      PACK_BUILD: ${{ needs.plan.outputs.pack_build }}
      PACK_FILTERS: ${{ needs.plan.outputs.pack_filters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          read -ra filters <<< "$PACK_BUILD"
          pnpm turbo run build "${filters[@]}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.plan.outputs.native == 'true' }}
        with:
          pattern: native-*
          path: packages/cores/file-core-native/prebuilds/
          merge-multiple: true
      - run: |
          read -ra filters <<< "$PACK_FILTERS"
          pnpm pack "${filters[@]}" --pack-destination ./local/npm-tarballs
      - run: python3 .github/scripts/check-npm-tarballs.py local/npm-tarballs
        env:
          SEZZLEE_REQUIRE_ALL_PREBUILDS: "1"
      - if: ${{ needs.plan.outputs.native == 'true' }}
        run: node .github/scripts/smoke-file-packages.mjs local/npm-tarballs
      - run: node .github/scripts/smoke-http-packages.mjs local/npm-tarballs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: local/npm-tarballs/*.tgz
